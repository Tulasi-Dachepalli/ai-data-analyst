services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aida
      POSTGRES_PASSWORD: aida
      POSTGRES_DB: aida
    ports:
      - "5432:5432"
    volumes:
      - aida_postgres_data:/var/lib/postgresql/data

volumes:
  aida_postgres_data:
